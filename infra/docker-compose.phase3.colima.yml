services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.13
    environment:
      ETCD_ENABLE_V2: "false"
    command: ["/usr/local/bin/etcd", "--advertise-client-urls=http://0.0.0.0:2379", "--listen-client-urls=http://0.0.0.0:2379"]
    ports:
      - "2379:2379"

  tidb:
    image: ${TIDB_IMAGE:-ekb-mirror/pingcap-tidb:v8.5.5}
    depends_on:
      - pd
      - tikv
    ports:
      - "4000:4000"
      - "10080:10080"

  pd:
    image: ${PD_IMAGE:-ekb-mirror/pingcap-pd:v8.5.5}
    depends_on:
      - etcd
    command: ["--name=pd", "--client-urls=http://0.0.0.0:2379", "--peer-urls=http://0.0.0.0:2380", "--advertise-client-urls=http://pd:2379", "--advertise-peer-urls=http://pd:2380", "--initial-cluster=pd=http://pd:2380"]
    ports:
      - "23790:2379"
      - "23800:2380"

  tikv:
    image: ${TIKV_IMAGE:-ekb-mirror/pingcap-tikv:v8.5.5}
    depends_on:
      - pd
    command: ["--addr=0.0.0.0:20160", "--advertise-addr=tikv:20160", "--pd=pd:2379"]
    ports:
      - "20160:20160"

  redis:
    image: ${REDIS_IMAGE:-ekb-mirror/redis:7}
    ports:
      - "6379:6379"

  neo4j:
    image: ${NEO4J_IMAGE:-ekb-mirror/neo4j:5.25.1-community-bullseye}
    environment:
      NEO4J_AUTH: neo4j/neo4j-password-1
    ports:
      - "7474:7474"
      - "7687:7687"

  milvus:
    image: ${MILVUS_IMAGE:-ekb-mirror/milvus:v2.4.4}
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"

  pulsar:
    image: ${PULSAR_IMAGE:-ekb-mirror/pulsar:3.2.3}
    command: ["/pulsar/bin/pulsar", "standalone"]
    ports:
      - "6650:6650"
      - "8083:8080"

  ekb-python-control-plane:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      EKB_DB_DRIVER: tidb
      EKB_TIDB_HOST: tidb
      EKB_TIDB_PORT: "4000"
      EKB_TIDB_USER: root
      EKB_TIDB_PASSWORD: ""
      EKB_TIDB_DATABASE: ekb_control_plane
      EKB_EVENT_PUBLISHER_BACKEND: pulsar
      EKB_PULSAR_SERVICE_URL: pulsar://pulsar:6650
      EKB_REDIS_URL: redis://redis:6379/0
      EKB_NEO4J_URI: bolt://neo4j:7687
      EKB_NEO4J_PASSWORD: neo4j-password-1
      EKB_MILVUS_URI: http://milvus:19530
      EKB_AUTH_TOKEN: ""
      EKB_MCP_RATE_LIMIT_PER_MINUTE: "6000"
      EKB_A2A_RATE_LIMIT_PER_MINUTE: "12000"
      EKB_A2A_ENABLED: "false"
      EKB_A2A_TOPIC: persistent://group/a2a/default
      EKB_A2A_SUBSCRIPTION: yadea-ekb-a2a
    ports:
      - "8080:8080"
    depends_on:
      - tidb
      - redis
      - pulsar

  ekb-java-kgraph:
    image: ${MAVEN_IMAGE:-ekb-mirror/maven:3.9-eclipse-temurin-21}
    working_dir: /workspace/services/java-kgraph
    command: mvn spring-boot:run
    volumes:
      - ..:/workspace
    ports:
      - "8081:8080"

  ekb-go-gateway:
    image: ${GO_GATEWAY_RUNTIME_IMAGE:-yadea-ekb-go-gateway:0.2.0}
    ports:
      - "8090:8090"
    depends_on:
      - redis
      - pulsar
