{{- if .Values.secrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
type: Opaque
stringData:
  EKB_TIDB_PASSWORD: {{ .Values.secrets.tidbPassword | quote }}
  EKB_PULSAR_TOKEN: {{ .Values.secrets.pulsarToken | quote }}
  EKB_NEO4J_PASSWORD: {{ .Values.secrets.neo4jPassword | quote }}
  EKB_MILVUS_TOKEN: {{ .Values.secrets.milvusToken | quote }}
  EKB_AUTH_TOKEN: {{ .Values.secrets.authToken | quote }}
{{- end }}
