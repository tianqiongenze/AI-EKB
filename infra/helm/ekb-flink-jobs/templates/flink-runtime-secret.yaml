apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-flink-runtime-secret
type: Opaque
stringData:
  ICEBERG_CATALOG_URI: {{ .Values.iceberg.catalogUri | quote }}
  ICEBERG_WAREHOUSE_URI: {{ .Values.iceberg.warehouseUri | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.credentials.awsAccessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.credentials.awsSecretAccessKey | quote }}
