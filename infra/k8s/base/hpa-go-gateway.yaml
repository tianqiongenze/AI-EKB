apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ekb-go-gateway-hpa
  namespace: ekb-control-plane
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ekb-go-gateway
  minReplicas: 6
  maxReplicas: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
