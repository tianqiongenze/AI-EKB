apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ekb-control-plane-hpa
  namespace: ekb-control-plane
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ekb-control-plane
  minReplicas: 4
  maxReplicas: 40
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
