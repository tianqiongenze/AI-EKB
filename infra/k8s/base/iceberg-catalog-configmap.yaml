apiVersion: v1
kind: ConfigMap
metadata:
  name: ekb-iceberg-catalog-config
  namespace: ekb-control-plane
data:
  ICEBERG_CATALOG_TYPE: nessie
  ICEBERG_CATALOG_URI: http://nessie.ekb-data.svc.cluster.local:19120/api/v1
  ICEBERG_REF: main
  ICEBERG_WAREHOUSE_URI: s3a://ekb-lakehouse/warehouse
  ICEBERG_IO_IMPL: org.apache.iceberg.aws.s3.S3FileIO
  ICEBERG_LOCK_IMPL: org.apache.iceberg.aws.dynamodb.DynamoDbLockManager
  ICEBERG_LOCK_TABLE: ekb-iceberg-locks
