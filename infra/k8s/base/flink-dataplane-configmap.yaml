apiVersion: v1
kind: ConfigMap
metadata:
  name: ekb-flink-dataplane-config
  namespace: ekb-control-plane
data:
  FLINK_STATE_BACKEND: rocksdb
  FLINK_CHECKPOINT_INTERVAL_MS: "30000"
  FLINK_CHECKPOINT_TIMEOUT_MS: "600000"
  FLINK_MIN_PAUSE_BETWEEN_CHECKPOINTS_MS: "5000"
  FLINK_MAX_CONCURRENT_CHECKPOINTS: "1"
  FLINK_RESTART_STRATEGY: failure-rate
  FLINK_RESTART_MAX_FAILURES_PER_INTERVAL: "5"
  FLINK_RESTART_FAILURE_RATE_INTERVAL: 10 min
  FLINK_RESTART_DELAY: 30 s
  ICEBERG_CATALOG: ekb_prod
  ICEBERG_WAREHOUSE_URI: s3a://ekb-lakehouse/warehouse
  ICEBERG_FILE_FORMAT: parquet
  ICEBERG_TARGET_FILE_SIZE_BYTES: "536870912"
  ICEBERG_DEFAULT_RETENTION_DAYS: "180"
