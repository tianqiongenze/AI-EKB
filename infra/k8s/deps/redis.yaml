apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cluster
  namespace: ekb-control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-cluster
  template:
    metadata:
      labels:
        app: redis-cluster
    spec:
      containers:
        - name: redis
          image: docker.io/redis:7.2-alpine
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ekb-deps-credentials
                  key: redis-password
          command: ["sh", "-c", 'exec redis-server --requirepass "$REDIS_PASSWORD"']
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster
  namespace: ekb-control-plane
spec:
  selector:
    app: redis-cluster
  ports:
    - port: 6379
      targetPort: 6379
