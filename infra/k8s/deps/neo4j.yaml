apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j
  namespace: ekb-control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      enableServiceLinks: false
      containers:
        - name: neo4j
          image: docker.io/neo4j:5.25.1-community-bullseye
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: ekb-deps-credentials
                  key: neo4j-auth
            - name: NEO4J_server_config_strict__validation_enabled
              value: "false"
          ports:
            - containerPort: 7474
            - containerPort: 7687
          readinessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: ekb-control-plane
spec:
  selector:
    app: neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
