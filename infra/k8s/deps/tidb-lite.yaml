apiVersion: apps/v1
kind: Deployment
metadata:
  name: tidb-cluster-tidb
  namespace: ekb-control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tidb-cluster-tidb
  template:
    metadata:
      labels:
        app: tidb-cluster-tidb
    spec:
      containers:
        - name: tidb
          image: docker.io/pingcap/tidb:v8.5.5
          ports:
            - containerPort: 4000
            - containerPort: 10080
          readinessProbe:
            tcpSocket:
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tidb-cluster-tidb
  namespace: ekb-control-plane
spec:
  selector:
    app: tidb-cluster-tidb
  ports:
    - name: sql
      port: 4000
      targetPort: 4000
    - name: status
      port: 10080
      targetPort: 10080
