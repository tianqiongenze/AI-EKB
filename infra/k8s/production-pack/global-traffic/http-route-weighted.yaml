apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ekb-global-route
  namespace: ekb-control-plane
spec:
  parentRefs:
    - name: ekb-global-gateway
  hostnames:
    - api.ekb.global
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ekb-go-gateway-region-a
          port: 80
          weight: 70
        - name: ekb-go-gateway-region-b
          port: 80
          weight: 30
