global:
  region: eu-central-1
  environment: production

controlPlane:
  replicas: 6
  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "8"
      memory: "16Gi"

gateway:
  replicas: 12
  resources:
    requests:
      cpu: "2"
      memory: "2Gi"
    limits:
      cpu: "8"
      memory: "8Gi"

datastore:
  tidb:
    enabled: true
    topology: regional-secondary
  redis:
    enabled: true
    mode: regional-secondary
  neo4j:
    enabled: true
    mode: causal-cluster-secondary
  milvus:
    enabled: true
    mode: regional-secondary
  pulsar:
    enabled: true
    mode: geo-replication-peer
