name: build-and-push-flink-session

on:
  workflow_run:
    workflows: ["ci-multilang"]
    types: [completed]
  workflow_dispatch:

jobs:
  build-and-push:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Flink session image
        uses: docker/build-push-action@v6
        with:
          context: ./services/flink-session-image
          file: ./services/flink-session-image/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/yadea-ekb-flink-session:latest
            ghcr.io/${{ github.repository }}/yadea-ekb-flink-session:${{ github.sha }}

      - name: Verify image has python3
        run: |
          docker pull ghcr.io/${{ github.repository }}/yadea-ekb-flink-session:${{ github.sha }}
          docker run --rm ghcr.io/${{ github.repository }}/yadea-ekb-flink-session:${{ github.sha }} python3 --version

      - name: Verify image has runtime jars signatures
        run: |
          docker run --rm ghcr.io/${{ github.repository }}/yadea-ekb-flink-session:${{ github.sha }} sh -c "ls /opt/flink/lib/ext | grep -E 'iceberg-flink-runtime|iceberg-nessie|hadoop-aws|aws-java-sdk-bundle'"

      - name: Validate preflight contract
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run preflight contract gate
        run: python scripts/check_flink_runtime_preflight_contract.py
