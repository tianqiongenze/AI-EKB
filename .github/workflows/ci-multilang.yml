name: ci-multilang

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest -q
      - name: Release protection verify
        run: python scripts/release_protect_artifacts.py --mode verify

  java:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/neo4j
        ports:
          - 7687:7687
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and test java-kgraph
        run: mvn -q test
        working-directory: services/java-kgraph
      - name: Release protection verify
        run: python scripts/release_protect_artifacts.py --mode verify

  go:
    runs-on: ubuntu-latest
    services:
      pulsar:
        image: apachepulsar/pulsar:3.2.3
        ports:
          - 6650:6650
          - 8080:8080
        options: >-
          --health-cmd="/pulsar/bin/pulsar version"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      milvus:
        image: milvusdb/milvus:v2.4.2
        ports:
          - 19530:19530
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Go test
        env:
          EKB_PULSAR_SERVICE_URL: pulsar://localhost:6650
        run: go test ./...
        working-directory: services/go-gateway
      - name: Release protection verify
        run: python scripts/release_protect_artifacts.py --mode verify

  release-gate:
    runs-on: ubuntu-latest
    needs: [python, java, go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install release-gate python dependencies
        run: python -m pip install pyyaml pre-commit
      - name: Run pre-commit checks
        run: pre-commit run --all-files
      - name: Verify contracts and manuals present
        run: |
          test -f contracts/openapi/control-plane.openapi.yaml
          test -f contracts/pulsar-topics.yaml
          test -f contracts/a2a-protocol.yaml
          test -f docs/api/developer-api-manual.zh-CN.md
          test -f docs/api/developer-api-manual.en.md
          test -f docs/product/platform-product-guide.zh-CN.md
          test -f docs/product/platform-product-guide.en.md
      - name: Verify semantic contract consistency
        run: python scripts/check_contract_consistency.py
      - name: Verify Flink runtime preflight contract
        run: python scripts/check_flink_runtime_preflight_contract.py
      - name: Helm lint flink jobs chart
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint infra/helm/ekb-flink-jobs
      - name: Verify replay e2e SLO threshold policy
        run: python scripts/check_replay_e2e_slo.py
      - name: Verify gateway SLO threshold policy
        run: python scripts/check_gateway_slo.py
      - name: Verify gateway perf report SLO gate
        run: python scripts/check_gateway_perf_report.py
      - name: Verify forbidden artifacts
        run: python scripts/check_forbidden_artifacts.py
      - name: Build protected release artifacts (dry-run key)
        env:
          EKB_RELEASE_PROTECT_KEY: ci-protect-key
        run: python scripts/release_protect_artifacts.py --mode protect --obfuscation-level 2
      - name: Verify release baseline after protect
        run: python scripts/release_protect_artifacts.py --mode verify
